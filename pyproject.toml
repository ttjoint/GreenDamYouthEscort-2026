[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-dam-2026"
version = "0.1.0"
description = "A reimplementation of the Green Dam Youth Escort content filter, built from reverse-engineering evidence rather than from its source"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "GreenDamYouthEscort-2026 contributors" }]
keywords = ["content-filter", "reimplementation", "reverse-engineering"]

# Deliberately empty. The filter core is pure standard library: no requests, no
# numpy, no ML runtime. Image classification (M4) will add its own optional
# extra when it lands, so the core stays installable on a bare interpreter.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# The host layer. Kept optional so the engine stays installable on a bare
# interpreter: `pip install green-dam-2026` gets the pure-stdlib filter, and
# `pip install green-dam-2026[host]` gets the Windows integration. The split
# mirrors the contract in docs/architecture.md - src/ is zero-dependency, host/
# is not.
host = [
    "pywin32>=306",
    "cryptography>=42",
    "psutil>=5.9",
    "pywebview>=5",
    "pystray>=0.19",
]
# Optional per feature, per docs/dependency-audit.md §3. M4 needs both; M5 is
# the one module where the Python route is weaker than the .NET one.
image = ["Pillow>=10", "onnxruntime>=1.17"]
screen = ["uiautomation>=2", "winrt-Windows.Media.Ocr>=2"]

[project.scripts]
green-dam = "green_dam.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "host/tests"]
# The legacy-binary tests skip themselves when the installation tree is absent,
# so a checkout without the original product still gets a green run.
addopts = "-q"
